id: app-function-test-app
name: app-function-test-APP
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://rapid-mist-1e1d0d007b-westeurope.webapp.fabricapps.net
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: true
    path: "packages/functions"
    buildCommand: "npm run build"
    auth:
      type: application
secrets:
  - name: MQTT_CLIENT2_AUTHN_ID_KEY
    description: "the content of the client2-authn-ID.key file so it can be used as a secret for the MQTT client"
  - name: MQTT_CLIENT2_AUTHN_ID_PEM
    description: "the content of the client2-authn-ID.pem"
